name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

# The group includes the event name so issue_comment runs (which usually get
# skipped by the job-level `if`) can't cancel an in-flight pull_request review —
# concurrency cancellation happens before job `if` conditions are evaluated.
concurrency:
  group: review-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.comment.body == '/review' &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    # The other false-red seen on 2026-07-30: a run was killed at exactly 10m
    # mid-review. Observed successful reviews take ~1–6.5m, so 10 left almost no
    # headroom on a large diff. 20 still bounds a runaway without failing honest
    # work.
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # opencode auto-runs `git add . && git commit && git push` whenever the
      # review session leaves the worktree dirty (running tests can do that),
      # and with use_github_token it never configures a git identity — so the
      # commit dies with exit 128 and the check goes red even on an approval.
      # This job is review-only (contents: read): give git an identity so the
      # commit succeeds, and point origin's push URL at a throwaway local bare
      # repo so nothing is ever pushed to the PR branch. Fetches still use the
      # real URL.
      - name: Git identity + push sink
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git init --bare --quiet "$RUNNER_TEMP/push-sink.git"
          # The sink must accept ANY push, because a rejected one fails the step
          # and turns the whole check red — after the review has already been
          # written. That is exactly what happened: 3 of 6 runs on 2026-07-30
          # died on "shallow update not allowed" having already produced (and in
          # one case posted) a verdict.
          #
          # Our own checkout is full (fetch-depth: 0), but the opencode action
          # fetches its own refs shallowly, so the auto-push can carry shallow
          # boundary info — and a bare repo refuses that unless told otherwise.
          # Nothing ever reads this repo; it exists only to swallow the push.
          git --git-dir="$RUNNER_TEMP/push-sink.git" config receive.shallowUpdate true
          git --git-dir="$RUNNER_TEMP/push-sink.git" config receive.denyNonFastForwards false
          git --git-dir="$RUNNER_TEMP/push-sink.git" config receive.denyCurrentBranch ignore
          git remote set-url --push origin "$RUNNER_TEMP/push-sink.git"

      - name: Resolve base ref
        id: refs
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            echo "base=${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.pull_request.base.ref }}" ]; then
            echo "base=${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"
          else
            PR_NUM="${{ github.event.pull_request.number || github.event.issue.number }}"
            BASE=$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" --json baseRefName --jq '.baseRefName' 2>/dev/null || echo "main")
            echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Load review prompt
        id: prompt
        run: |
          {
            echo 'content<<PROMPT_EOF'
            sed "s|\${BASE_REF}|${{ steps.refs.outputs.base }}|g" .github/opencode/review-prompt.md
            echo ''
            echo '---'
            echo ''
            echo "PR #${{ github.event.pull_request.number || github.event.issue.number }} in ${{ github.repository }}."
            echo "Base ref: ${{ steps.refs.outputs.base }}"
            echo PROMPT_EOF
          } >> "$GITHUB_OUTPUT"

      - uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: openrouter/deepseek/deepseek-v4-pro
          use_github_token: true
          prompt: ${{ steps.prompt.outputs.content }}
